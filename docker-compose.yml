services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messenger_db
    ports:
      - "5433:5432"
    volumes:
      - messenger_pg_data:/var/lib/postgresql/data
    networks:
      - messenger_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - messenger_net
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/messenger_db
      ASYNC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/messenger_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production_use_openssl_rand_hex_32}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend
      BASE_URL: http://localhost:8000
      APP_ENV: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - messenger_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - messenger_net
    ports:
      - "5173:80"

networks:
  messenger_net:
    driver: bridge

volumes:
  messenger_pg_data:
  messenger_uploads:
